name: autoGrader

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - uses: actions/checkout@v4
    - name: Setup dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ cmake valgrind
    - name: cmake
      run: cmake -DCMAKE_BUILD_TYPE=Debug -S . -B build
    - name: make
      run: cmake --build build
    - name: ctest
      run: ctest --test-dir build --output-on-failure
    - name: memory tests
      if: success() || failure()
      run: valgrind --leak-check=full --error-exitcode=1 ./build/BinarySearchTreeTest
